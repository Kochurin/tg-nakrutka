name = "tg-nakrutka"
main = "src/index.js"
compatibility_date = "2026-10-01"

# не больше 10 свежих проверок в минуту с одного адреса (кэшированные ответы не считаются)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1701"
simple = { limit = 10, period = 60 }

# снимки числа подписчиков по дням
[[d1_databases]]
binding = "DB"
database_name = "tg-nakrutka"
database_id = "8950c910-48e8-4515-85a7-cd5ff538a113"

[triggers]
crons = ["41 4 * * *"]   # раз в сутки удаляем снимки старше 400 дней
